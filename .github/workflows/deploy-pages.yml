name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          # The browser binaries are only needed for local screenshots.
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

      - name: Build web app
        env:
          # Project sites are served from /<repo>/.
          VITE_BASE: /${{ github.event.repository.name }}/
        run: npm run build -w @rebuilt/web

      - name: Add SPA fallback
        run: cp apps/web/dist/index.html apps/web/dist/404.html

      - name: Configure Pages
        id: pages
        continue-on-error: true
        uses: actions/configure-pages@v5
        with:
          # Works when the workflow token may enable Pages; otherwise the
          # repository setting has to be switched on once by hand.
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
